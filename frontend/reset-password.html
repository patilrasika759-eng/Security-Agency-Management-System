
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | ShieldPoint</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="index.html">⬡ ShieldPoint Security</a></header>
<main class="page-shell">
<header class="page-header"><a href="login.html">← Back to login / लॉगिनकडे परत</a><h1>Reset Password / पासवर्ड बदला</h1></header>
<section class="form-panel" style="max-width:520px">
<form id="resetForm">
<label>New Password / नवीन पासवर्ड<input id="newPassword" type="password" required minlength="8" autocomplete="new-password"></label>
<label>Confirm Password / पासवर्ड पुन्हा टाका<input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></label>
<button class="btn btn-gold full" type="submit">Reset password / पासवर्ड रीसेट करा</button>
<p class="message" id="resetMessage" aria-live="polite"></p>
<p>Demo validation only. A secure backend and verified reset token are required to change a real account password.</p>
</form>
</section>
</main>
</body></html>
